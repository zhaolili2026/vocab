<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>上海初中英语单词通</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#4A90D9;--pl:#E8F2FF;--ok:#52C41A;--no:#FF4D4F;--warn:#FAAD14;--bg:#F5F7FA;--card:#FFF;--t1:#333;--t2:#666;--t3:#999;--bd:#EEE;--r:12px;--sh:0 2px 12px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);font-size:17px;line-height:1.6;padding-bottom:70px;min-height:100vh}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;display:flex;border-top:1px solid var(--bd);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--t3);cursor:pointer;transition:color .2s}
.tab-item.active{color:var(--p)}
.tab-item .icon{font-size:22px;margin-bottom:2px}
.page{display:none;padding:16px;padding-bottom:80px;min-height:calc(100vh - 60px)}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.btn{display:inline-block;padding:10px 24px;border-radius:25px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.btn-primary{background:var(--p);color:#fff}.btn-primary:active{background:#3a7bc8}
.btn-success{background:var(--ok);color:#fff}.btn-danger{background:var(--no);color:#fff}
.btn-outline{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn-full{width:100%;display:block}.btn-sm{padding:6px 16px;font-size:13px}
.fab-learn{position:fixed;left:16px;right:16px;bottom:74px;z-index:90;padding:16px;font-size:18px;font-weight:700;border:none;border-radius:30px;color:#fff;background:linear-gradient(135deg,#5b8def,#764ba2);box-shadow:0 8px 24px rgba(102,126,234,.5);cursor:pointer;animation:fabBreath 2.2s ease-in-out infinite}
@keyframes fabBreath{0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(102,126,234,.45)}50%{transform:scale(1.03);box-shadow:0 12px 30px rgba(102,126,234,.65)}}
.stat-row{display:flex;justify-content:space-around;margin:12px 0}
.stat-item{text-align:center}.stat-num{font-size:24px;font-weight:700;color:var(--p)}.stat-label{font-size:12px;color:var(--t3)}
.progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-fill.blue{background:var(--p)}.progress-fill.green{background:var(--ok)}.progress-fill.orange{background:var(--warn)}
.level-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px}
.level-card h2{font-size:20px;margin-bottom:4px}.level-card .exp-text{font-size:13px;opacity:.9}
.lvbar{position:relative;margin-top:14px}
.lvtrack{position:absolute;top:6px;height:3px;background:rgba(255,255,255,.3);border-radius:2px}
.lvfill{position:absolute;top:6px;height:3px;background:#fff;border-radius:2px;transition:width .4s}
.lvsteps{display:flex;position:relative}
.lvstep{flex:1;text-align:center;position:relative;font-size:10px;color:#fff}
.lvstep .dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6);margin:0 auto 5px;position:relative;z-index:1}
.lvstep.done .dot{background:#fff;border-color:#fff}
.lvstep.cur .dot{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.lvstep .t{font-weight:700;font-size:11px}
.lvstep .s{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvstep.cur .t,.lvstep.cur .s{opacity:1}
.ladder{padding:4px 0}
.lad-node{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.lad-node:last-child{padding-bottom:0}
.lad-col{position:relative;width:30px;flex-shrink:0;display:flex;justify-content:center}
.lad-node:not(:last-child) .lad-col::after{content:'';position:absolute;top:30px;left:50%;transform:translateX(-50%);width:2px;height:calc(100% - 16px);background:var(--bd)}
.lad-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#e5e7eb;color:#9ca3af}
.lad-node.done .lad-dot{background:var(--ok);color:#fff}
.lad-node.cur .lad-dot{background:var(--p);color:#fff;box-shadow:0 0 0 4px var(--pl)}
.lad-body{flex:1;min-width:0}
.lad-name{font-weight:600;font-size:14px}
.lad-node.lock .lad-name{color:var(--t3)}
.lad-sub{font-size:12px;color:var(--t3);margin-top:1px}
.lad-state{font-size:12px;flex-shrink:0;align-self:center;color:var(--t3)}
.lad-node.cur .lad-state{color:var(--p);font-weight:600}
.lad-node.done .lad-state{color:var(--ok)}
.streak-card{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);color:#fff;border-radius:var(--r);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.streak-card .fire{font-size:22px}.streak-card .num{font-size:22px;font-weight:700}
.daily-select{display:flex;gap:8px;justify-content:center;margin:12px 0}
.daily-opt{padding:8px 16px;border-radius:20px;border:2px solid var(--bd);font-size:14px;cursor:pointer;transition:all .2s}
.daily-opt.active{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:600}
.daily-custom{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:14px;color:var(--t2)}
.daily-custom input{width:80px;padding:8px 10px;border:2px solid var(--bd);border-radius:20px;font-size:15px;text-align:center;color:var(--p);font-weight:600;-moz-appearance:textfield}
.daily-custom input:focus{outline:none;border-color:var(--p)}
.word-card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.word-card .word{font-size:28px;font-weight:700;color:var(--p);margin-bottom:4px}
.word-card .pos{color:var(--t2);font-size:14px;margin-bottom:8px}
.word-card .pos .ipa{color:var(--p);font-family:"Times New Roman",serif}
.word-card .cn{font-size:23px;color:var(--t1);margin-bottom:8px}
.word-card .example{background:#f8f9fa;border-radius:8px;padding:12px;margin:8px 0;font-size:15px}
.word-card .example .en{color:var(--t1);margin-bottom:4px}
.word-card .example .cn{font-size:13px;color:var(--t2)}
.word-card .forms{background:#e8f5e9;border-radius:8px;padding:10px;margin:8px 0;font-size:13px;color:#2e7d32}
.word-card .tip{background:#fff8e1;border-radius:8px;padding:10px;margin:8px 0;font-size:13px;color:#f57f17}
.word-card .colloc{background:#eef3ff;border-radius:8px;padding:10px;margin:8px 0;font-size:13px;color:#33548c}
.word-card .colloc .ct{font-weight:600;margin-bottom:4px}
.word-card .colloc .ci{padding:2px 0;line-height:1.5}
.use-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.use-chip{background:var(--pl);color:var(--p);border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.use-chip .uc-cn{color:var(--t2);font-size:12px}
.essay-box{width:100%;min-height:120px;border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;line-height:1.6;margin-top:8px;resize:vertical}
.essay-box:focus{outline:none;border-color:var(--p)}
.speak-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--p);color:#fff;font-size:18px;cursor:pointer;vertical-align:middle;margin-left:8px}
.flip-card{perspective:1000px;width:100%;height:250px;margin:20px 0;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:var(--sh)}
.flip-front{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.flip-back{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;transform:rotateY(180deg)}
.flip-front .fword{font-size:60px;font-weight:800}.flip-front .fpos{font-size:14px;opacity:.8;margin-top:8px}
.flip-back .fcn{font-size:28px;font-weight:700}.flip-back .fpos{font-size:14px;opacity:.8;margin-top:8px}
.letter-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.letter-btn{width:40px;height:40px;border-radius:8px;border:2px solid var(--p);background:#fff;color:var(--p);font-size:18px;font-weight:700;cursor:pointer;transition:all .2s}
.letter-btn.used{opacity:.3;pointer-events:none}.letter-btn:active{transform:scale(.9)}
.answer-area{min-height:50px;border:2px dashed var(--bd);border-radius:8px;padding:10px;margin:12px 0;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.answer-letter{width:36px;height:36px;border-radius:6px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer}
.match-container{display:flex;gap:16px;margin:16px 0}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px}
.match-item{padding:12px;border-radius:8px;border:2px solid var(--bd);text-align:center;font-size:16px;cursor:pointer;transition:all .2s}
.match-item.selected{border-color:var(--p);background:var(--pl)}
.match-item.matched{border-color:var(--ok);background:#e6f7e6;opacity:.6;pointer-events:none}
.match-item.wrong-flash{border-color:var(--no);background:#ffebee}
.pos-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.pos-opt{padding:16px;border-radius:8px;border:2px solid var(--bd);text-align:center;font-size:17px;cursor:pointer;transition:all .2s;background:#fff}
.pos-opt:active{transform:scale(.95)}.pos-opt.correct{border-color:var(--ok);background:#e6f7e6}.pos-opt.wrong{border-color:var(--no);background:#ffebee}
.nav-btns{display:flex;gap:12px;margin-top:16px}.nav-btns .btn{flex:1}
.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.achievement{text-align:center;padding:12px 8px;border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.achievement .icon{font-size:32px}.achievement .name{font-size:11px;color:var(--t2);margin-top:4px}
.achievement.locked{opacity:.4;filter:grayscale(1)}
.group-item{border-bottom:1px solid var(--bd);padding:12px 0}
.group-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.group-header .gname{font-weight:600}.group-header .gcounts{font-size:13px;color:var(--t2)}
.group-words{display:none;margin-top:8px;padding-left:8px}.group-words.open{display:block}
.group-word{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid #f5f5f5}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.cal-header{text-align:center;font-size:12px;color:var(--t3);font-weight:600;padding-bottom:2px}
.cal-day{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;font-size:13px;border-radius:50%;color:var(--t2)}
.cal-day.today{border:2px solid var(--p);color:var(--p);font-weight:700}
.cal-day.checked{background:var(--ok);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(82,196,26,.4)}
.cal-day.checked.today{border-color:#fff}
.cal-day.empty{visibility:hidden}
/* 统计页 hero 卡片 */
.stats-hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 8px 22px rgba(102,126,234,.35)}
.stats-hero .sh-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.stats-hero .sh-title{font-size:15px;font-weight:600;opacity:.95}
.stats-hero .sh-pct{font-size:30px;font-weight:800;line-height:1}
.stats-hero .sh-bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.stats-hero .sh-fill{height:100%;background:#fff;border-radius:6px;transition:width .5s}
.stats-hero .sh-sub{font-size:12px;opacity:.9;margin-top:8px}
.stat-cards{display:flex;gap:10px;margin-bottom:12px}
.stat-c{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 8px;text-align:center}
.stat-c .ic{font-size:22px}
.stat-c .n{font-size:24px;font-weight:800;margin:2px 0;color:var(--t1)}
.stat-c .l{font-size:12px;color:var(--t3)}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:20px;padding:22px;width:90%;max-width:400px;text-align:center;position:relative;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-close{position:absolute;top:8px;right:14px;font-size:24px;line-height:1;color:var(--t3);cursor:pointer;padding:4px}
.modal-content h3{font-size:18px;margin-bottom:2px}
.modal-content .btn-primary{background:linear-gradient(135deg,#5b8def,#764ba2);margin-top:8px;box-shadow:0 6px 16px rgba(102,126,234,.35)}
.modal-content .btn-primary:active{opacity:.9}
.sum-stats{display:flex;gap:10px;margin:12px 0}
.sum-stat{flex:1;border-radius:14px;padding:14px 4px 12px;background:var(--bg);border:1px solid rgba(0,0,0,.04)}
.sum-stat:nth-child(1){background:linear-gradient(180deg,#F2F7FF,#fff)}
.sum-stat:nth-child(2){background:linear-gradient(180deg,#EDF9F1,#fff)}
.sum-stat:nth-child(3){background:linear-gradient(180deg,#FDF0F0,#fff)}
.sum-stat .n{font-size:28px;font-weight:800;line-height:1}
.sum-stat .l{font-size:12px;color:var(--t3);margin-top:5px}
.sum-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum-chip{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:6px 14px;font-size:13px;color:var(--t2);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sum-chip b{color:var(--p)}
.sum-quote{background:var(--pl);color:var(--p);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;margin:12px 0;font-weight:500}
.sum-list-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:8px;text-align:left}
.sum-list-head .cnt{font-size:12px;color:var(--p);font-weight:600;background:var(--pl);border-radius:12px;padding:2px 10px}
.sum-list{max-height:40vh;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:2px}
.sum-words{display:flex;flex-wrap:wrap;gap:8px}
.goal-ok{background:linear-gradient(135deg,#e8fff1,#eefbf3);border:1px solid #b7efc5;color:#1b8f4f;border-radius:12px;padding:12px 14px;margin:10px 0 0;font-size:14px;font-weight:600;text-align:center}
.task-card{background:linear-gradient(135deg,#f8fbff,#f6f8ff);border:1px solid #dbeafe;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.task-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task-title{font-size:16px;font-weight:700;color:var(--t1)}
.task-sub{font-size:13px;color:var(--t3);margin-top:4px;line-height:1.5}
.task-tag{background:var(--pl);color:var(--p);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.seg-filter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seg-filter .daily-opt{min-width:78px;text-align:center}
.rev-sections{display:grid;gap:10px;margin-top:8px}
.rev-sec{background:#fafbff;border:1px solid var(--bd);border-radius:12px;padding:10px}
.rev-sec h4{font-size:14px;margin-bottom:8px}
.confetti-wrap{pointer-events:none;position:absolute;left:0;right:0;top:0;height:120px;overflow:hidden}
.confetti{position:absolute;top:-12px;width:10px;height:16px;opacity:.95;animation:fall 1200ms linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(120px) rotate(540deg);opacity:0}}
.sw{flex:1 1 calc(33.33% - 8px);min-width:96px;border-radius:12px;padding:9px 11px;cursor:pointer;text-align:left;line-height:1.25;color:var(--t1);border:1px solid rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s}
.sw:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
.sw:active{transform:scale(.95)}
.sw .e{font-weight:700;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .c{font-size:12px;color:var(--t2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sw.c0{background:#EFF4FB}
.sw.c1{background:#EEF6EE}
.sw.c2{background:#FBF3E9}
.sw.c3{background:#FBEEF4}
.sw.c4{background:#F0EEFB}
.sw.c5{background:#EAF6F7}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--t1)}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-badge{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;color:#fff}
.quiz-badge.spell{background:#7c4dff}.quiz-badge.matchq{background:#00bfa5}.quiz-badge.posq{background:#ff6d00}
.fade-in{animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bounce{animation:bounce .4s}@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.empty-state{text-align:center;padding:40px 20px;color:var(--t3)}.empty-state .eicon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
<div id="page-home" class="page active"></div>
<div id="page-learn" class="page"></div>
<div id="page-review" class="page"></div>
<div id="page-stats" class="page"></div>
<div id="page-book" class="page"></div>
</div>
<div class="tab-bar">
<div class="tab-item active" data-page="home"><span class="icon">🏠</span>首页</div>
<div class="tab-item" data-page="learn"><span class="icon">📖</span>学习</div>
<div class="tab-item" data-page="review"><span class="icon">🔄</span>复习</div>
<div class="tab-item" data-page="stats"><span class="icon">📊</span>统计</div>
<div class="tab-item" data-page="book"><span class="icon">📚</span>词库</div>
</div>
<div class="modal" id="modal"><div class="modal-content" id="modal-content"></div></div>
<script>
// ===== DATA CONVERSION =====
// ===== WORD DATA (compact format: word|pos|chinese) =====

function classifyWord(w){
  var en=(w.en||'').toLowerCase(), pos=w.pos||'', cn=w.cn||'';
  if(pos==='phr.')return 'phrase';

  if(/电脑|网络|互联网|手机|电话|科技|技术|机器|科学|政府|社会|文化|历史|经济|法律|战争|和平|环境|世界|国际|公司|组织|系统|信息|新闻|报纸|杂志|节目|广告|发明|实验|能源|工业|政治/.test(cn))return 'tech';
  if(/^num/.test(pos)||/数|许多|几个|半|双|倍|百分|程度|几乎|相当|总共|大约|更多|更少|全部|每|第|零|一对|多少|足够|额外|数量/.test(cn))return 'number';
  if(/^(prep|conj|pron|art|aux|det|interj)/.test(pos)||pos==='v.aux.')return 'func';

var _audio=null;
function speak(t){
  if(!t)return;
  var word=String(t).trim();
  // 单个英文单词优先用在线发音（更稳定，不依赖系统语音包）；失败再回退本地合成
  if(/^[a-zA-Z][a-zA-Z'-]*$/.test(word)){
    try{
      if(!_audio)_audio=new Audio();
      _audio.onerror=function(){synthSpeak(word)};
      _audio.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type=2';
      var pr=_audio.play();
      if(pr&&pr.catch)pr.catch(function(){synthSpeak(word)});
      return;
    }catch(e){}
  }
  synthSpeak(word);
}
function synthSpeak(t){
  if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读，请用 Chrome / Edge / Safari 打开');return}
  if(!t)return;
  var tries=0;
  var doSpeak=function(){
    // 语音列表还没就绪时，最多等待几轮再发音
    if(!_voices.length&&tries<10){tries++;loadVoices();setTimeout(doSpeak,200);return}
    var u=new SpeechSynthesisUtterance(String(t));
    u.lang='en-US';u.rate=0.85;
    var v=pickVoice();if(v)u.voice=v; // 没有英文语音时也照样朗读（用默认语音）
    u.onerror=function(e){console.warn('TTS error:',e.error)};
    try{speechSynthesis.resume();}catch(e){}
    speechSynthesis.speak(u);
    // Chrome/Edge 偶尔会停在 paused 状态，需要手动 resume 才出声
    setTimeout(function(){try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},150);
  };
  // 已知 Chrome bug：cancel() 后立刻 speak() 会被忽略，延迟一拍更可靠
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(doSpeak,60);
}

// Phase 3: Quiz
function genQuiz(){
  var qs=[];
  LW.forEach(function(w,i){
    // 已掌握词减负：只保留词性题；新词/不熟词保留拼写+词性
    if(S.learned[w.en]==='m')qs.push({t:'pos',wi:i,w:w});
    else{qs.push({t:'spell',wi:i,w:w});qs.push({t:'pos',wi:i,w:w});}
  });
  for(var i=0;i<LW.length;i+=5){var b=LW.slice(i,Math.min(i+5,LW.length));var hard=b.filter(function(w){return S.learned[w.en]!=='m'});if(hard.length>=3)qs.push({t:'match',wi:i,ws:hard.slice(0,5)})}
  var sp=shuffle(qs.filter(function(q){return q.t==='spell'}));
  var mt=shuffle(qs.filter(function(q){return q.t==='match'}));
  var ps=shuffle(qs.filter(function(q){return q.t==='pos'}));
  var all=[sp,mt,ps];S.quiz=[];
  var mx=Math.max(sp.length,mt.length,ps.length);
  for(var i=0;i<mx;i++){var order=shuffle([0,1,2]);for(var j=0;j<3;j++){if(i<all[order[j]].length)S.quiz.push(all[order[j]][i])}}
}

  if(q.t==='spell')rSpell(q);else if(q.t==='match')rMatch(q);else rPosQ(q);
}

// Spell Quiz

}

function updSlots(){var s=window._ss,l=window._sl;for(var i=0;i<s.length;i++){var e=$$('.answer-letter[data-i="'+i+'"]')[0];if(s[i]!==null){e.textContent=l[s[i]];e.style.visibility='visible'}else{e.textContent='';e.style.visibility='hidden'}}$('#sb').disabled=s.indexOf(null)>=0&&s.filter(function(x){return x===null}).length>0?false:true;$('#sb').disabled=s.filter(function(x){return x!==null}).length<s.length}
function chkSpell(){var s=window._ss,l=window._sl,ans='';for(var i=0;i<s.length;i++)ans+=l[s[i]];var ok=ans.toLowerCase()===window._sa.toLowerCase();var q=S.quiz[S.qi];S.qr.push({w:q.w,ok:ok});if(ok){S.learned[q.w.en]='m'}else{S.learned[q.w.en]='r'}scheduleWord(q.w.en,ok);save();saveSession();showFb(ok,q.w,function(){S.qi++;rLearn()})}

// Match Quiz
function rMatch(q){
  var ws=q.ws;
  var L=shuffle(ws.map(function(w,i){return{i:i,t:w.cn}}));
  var R=shuffle(ws.map(function(w,i){return{i:i,t:w.en}}));
  window._mL=L;window._mR=R;S.mm=new Set();S.mc=0;S.mt=ws.length;S._mw=ws[0];S._mws=ws;
  function mkItems(arr,side){return arr.map(function(it){return'<div class="match-item" data-s="'+side+'" data-i="'+it.i+'" onclick="mSel(\''+side+'\','+it.i+',this)">'+it.t+'</div>'}).join('')}
  $('#qc').innerHTML='<div style="text-align:center;font-size:16px;font-weight:600;margin:12px 0">将中文和英文配对</div><div class="match-container"><div class="match-col">'+mkItems(L,'L')+'</div><div class="match-col">'+mkItems(R,'R')+'</div></div><div style="text-align:center;color:var(--t3);font-size:13px;margin-top:8px" id="mp">0/'+ws.length+'</div>';
}
function mSel(side,idx,el){

  if(S.ms.s===side){S.ms.e.classList.remove('selected');S.ms={s:side,i:idx,e:el};el.classList.add('selected');return}
  if(S.ms.i===idx){sfx(true);S.ms.e.classList.remove('selected');S.ms.e.classList.add('matched');el.classList.add('matched');S.mm.add(side+'_'+idx);S.mm.add((side==='L'?'R':'L')+'_'+idx);S.mc++;$('#mp').textContent=S.mc+'/'+S.mt;S.ms=null;if(S.mc>=S.mt){setTimeout(function(){S.qr.push({w:S._mw,ok:true});(S._mws||[]).forEach(function(w){S.learned[w.en]='m';scheduleWord(w.en,true)});save();saveSession();S.qi++;rLearn()},600)}}else{sfx(false);el.classList.add('wrong');S.ms.e.classList.add('wrong');var se=S.ms.e;setTimeout(function(){el.classList.remove('wrong');se.classList.remove('wrong');S.ms=null},500)}
}

// POS Quiz
function rPosQ(q){
  var w=q.w,cp=w.pos;
  var all=['n.','v.','adj.','adv.','prep.','conj.','pron.','num.'];
  var near={
    'n.':['adj.','v.','pron.'],'v.':['n.','adj.','adv.'],'adj.':['adv.','n.','v.'],'adv.':['adj.','v.','conj.'],
    'prep.':['conj.','adv.','pron.'],'conj.':['prep.','adv.','pron.'],'pron.':['num.','conj.','prep.'],'num.':['pron.','adj.','n.']
  };

// 用 Web Audio 合成答对/答错提示音（无需音频文件）
var _actx=null;
function sfx(ok){
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    var ac=_actx;
    var play=function(){
      var now=ac.currentTime;
      function tone(freq,start,dur,type,vol){
        var o=ac.createOscillator(),g=ac.createGain();
        o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001,now+start);
        g.gain.exponentialRampToValueAtTime(vol||0.2,now+start+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
        o.start(now+start);o.stop(now+start+dur+0.02);
      }
      if(ok){tone(660,0,0.13,'sine',0.3);tone(990,0.1,0.2,'sine',0.3);}      // 上行“叮咚”
      else{tone(196,0,0.22,'square',0.2);tone(155,0.13,0.26,'square',0.2);}  // 下行“嗡”
    };
    // 自动播放策略下 AudioContext 可能处于 suspended，需先异步 resume 再发声
    if(ac.state==='suspended'){ac.resume().then(play).catch(play);}else{play();}
  }catch(e){}
}

  _rec.onresult=function(e){

}
function calMonth(d){calM+=d;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}rStats()}

// ========== WORD BOOK ==========
var OG={},bookQuery='',bookFilter='all';
var bookMode=S.mode; // 词库视图独立于学习模式
function bookGroups(){return bookMode==='theme'?THEME_GROUPS:GROUPS}
function setBookView(m){if(bookMode===m)return;bookMode=m;OG={};rBook()}
function setBookQuery(v){bookQuery=(v||'').toLowerCase().trim();rBook()}
function clearBookQuery(){bookQuery='';rBook()}
function setBookFilter(f){bookFilter=f;rBook()}
var _ipaLoading=false;
function loadGroupIPA(gi){
  if(_ipaLoading)return;
  var g=bookGroups()[gi];if(!g)return;
  var list=g.words.filter(function(w){return /^[a-zA-Z][a-zA-Z'-]*$/.test(w.en)&&ipaStore()[w.en.toLowerCase()]===undefined});
  if(!list.length)return;
  _ipaLoading=true;
  var i=0;
  function upd(){var b=document.getElementById('ipaBtn'+gi);if(b)b.textContent='加载中… '+i+'/'+list.length}
  upd();
  function next(){
    if(i>=list.length){_ipaLoading=false;rBook();return}
    ensureIPA(list[i].en,function(){i++;upd();setTimeout(next,250)}); // 每词间隔 250ms 限速
  }
  next();
}
function rBook(){
  var ag=bookGroups();
  var h='<div class="daily-select" style="margin-bottom:10px"><div class="daily-opt'+(bookMode==='az'?' active':'')+'" onclick="setBookView(\'az\')">🔤 字母序</div><div class="daily-opt'+(bookMode==='theme'?' active':'')+'" onclick="setBookView(\'theme\')">📚 主题分类</div></div>';
  h+='<div class="card" style="padding:12px;margin-bottom:10px"><div style="display:flex;gap:8px"><input type="search" value="'+bookQuery.replace(/"/g,'&quot;')+'" oninput="setBookQuery(this.value)" placeholder="搜索单词 / 中文意思" style="flex:1;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font-size:15px">'+(bookQuery?'<button class="btn btn-sm btn-outline" onclick="clearBookQuery()">清空</button>':'')+'</div><div class="seg-filter"><div class="daily-opt'+(bookFilter==='all'?' active':'')+'" onclick="setBookFilter(\'all\')">全部</div><div class="daily-opt'+(bookFilter==='m'?' active':'')+'" onclick="setBookFilter(\'m\')">已会</div><div class="daily-opt'+(bookFilter==='r'?' active':'')+'" onclick="setBookFilter(\'r\')">待复习</div></div></div>';
  h+='<div style="margin-bottom:12px;color:var(--t3);font-size:13px">'+(bookMode==='theme'?'📚 主题视图':'🔤 字母序视图')+' · 共'+ag.length+'组 · '+cntT()+'词条</div>';
  var shown=0,totalMatch=0;
  ag.forEach(function(g,gi){
    var words=(bookQuery?g.words.filter(function(w){return w.en.toLowerCase().indexOf(bookQuery)>=0||w.cn.indexOf(bookQuery)>=0}):g.words).filter(function(w){return bookFilter==='all'||S.learned[w.en]===bookFilter});
    if(!words.length)return;
    shown++;totalMatch+=words.length;
    var mc=words.filter(function(w){return S.learned[w.en]==='m'}).length;
    var rc=words.filter(function(w){return S.learned[w.en]==='r'}).length;
    var op=OG[gi]||!!bookQuery;
    h+='<div class="card fade-in" style="padding:12px;margin-bottom:8px"><div class="group-header" onclick="OG['+gi+']=!OG['+gi+'];rBook()"><span class="name">'+g.name+'</span><span class="counts">'+words.length+'词'+(mc?'（'+mc+'个已会）':'')+(rc?' · '+rc+'个待复习':'')+'</span><span style="color:var(--t3)">'+(op?'▼':'▶')+'</span></div>';
    if(op){
      var miss=words.filter(function(w){return /^[a-zA-Z][a-zA-Z'-]*$/.test(w.en)&&ipaStore()[w.en.toLowerCase()]===undefined}).length;
      if(miss)h+='<div style="text-align:center;margin:6px 0"><button class="btn btn-sm btn-outline" id="ipaBtn'+gi+'" onclick="event.stopPropagation();loadGroupIPA('+gi+')">🔤 加载本组音标 ('+miss+')</button></div>';
      h+='<div class="group-words open">';words.forEach(function(w){var st=S.learned[w.en];var badge=st==='m'?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px"></span>':st==='r'?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--no);margin-right:6px"></span>':'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#d9d9d9;margin-right:6px"></span>';var ip=(ipaStore()[w.en.toLowerCase()]||'');h+='<div class="group-word"><span>'+badge+'<b>'+w.en+'</b>'+(ip?' <span class="ipa" style="color:var(--p);font-family:\'Times New Roman\',serif">'+ip+'</span>':'')+' <span style="color:var(--t3)">'+w.pos+'</span> '+w.cn+'</span></div>'});h+='</div>'}
    h+='</div>';
  });
  if(bookQuery&&shown)h='<div style="margin-bottom:10px;color:var(--t3);font-size:13px">找到 '+totalMatch+' 个结果</div>'+h;
  if(!shown)h+='<div class="empty-state"><div class="icon">🔎</div><h3>没找到匹配单词</h3></div>';
  $('#page-book').innerHTML=h;
}

// ========== INIT ==========
nav('home');

</script>
</body>
</html>
